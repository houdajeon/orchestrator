apiVersion: v1
kind: Service
metadata:
  name: rabbit-queue
  labels:
    app: rabbit-queue
spec:
  type: ClusterIP
  ports:
    - port: 5672
      targetPort: 5672
      name: amqp
    - port: 15672
      targetPort: 15672
      name: http-mgmt
  selector:
    app: rabbit-queue
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbit-queue
  labels:
    app: rabbit-queue
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rabbit-queue
  template:
    metadata:
      labels:
        app: rabbit-queue
    spec:
      containers:
        - name: rabbit-queue
          image: aymening01/rabbit-queue:latest
          ports:
            - containerPort: 5672
              name: amqp
            - containerPort: 15672
              name: http-mgmt
          env:
            - name: RABBITMQ_USER
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-secrets
                  key: RABBITMQ_USER
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-secrets
                  key: RABBITMQ_PASSWORD
            - name: RABBITMQ_QUEUE
              value: "billing-queue"
