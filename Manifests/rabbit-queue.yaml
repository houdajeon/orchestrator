apiVersion: v1
kind: Service
metadata:
  name: rabbit-queue
spec:
  clusterIP: None
  selector:
    app: rabbit-queue
  ports:
    - port: 5672
      targetPort: 5672
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rabbit-queue
spec:
  serviceName: rabbit-queue
  replicas: 1
  selector:
    matchLabels:
      app: rabbit-queue
  template:
    metadata:
      labels:
        app: rabbit-queue
    spec:
      containers:
        - name: rabbit-queue
          image: aymening01/rabbit-queue:v1.0
          ports:
            - containerPort: 5672
          env:
            - name: RABBITMQ_USER
              valueFrom:
                secretKeyRef:
                  name: orchestrator-secrets
                  key: RABBITMQ_USER
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: orchestrator-secrets
                  key: RABBITMQ_PASSWORD
            - name: RABBITMQ_QUEUE
              valueFrom:
                configMapKeyRef:
                  name: orchestrator-config
                  key: RABBITMQ_QUEUE
          volumeMounts:
            - name: rabbit-queue-data
              mountPath: /var/lib/rabbitmq
  volumeClaimTemplates:
    - metadata:
        name: rabbit-queue-data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: local-path
        resources:
          requests:
            storage: 2Gi
