apiVersion: v1
kind: Service
metadata:
  name: api-gateway-app
spec:
  type: NodePort
  selector:
    app: api-gateway-app
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway-app
  template:
    metadata:
      labels:
        app: api-gateway-app
    spec:
      containers:
        - name: api-gateway-app
          image: aymening01/api-gateway-app:latest
          ports:
            - containerPort: 3000
          env:
            - name: RABBITMQ_USER
              valueFrom:
                secretKeyRef:
                  name: orchestrator-secrets
                  key: RABBITMQ_USER
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: orchestrator-secrets
                  key: RABBITMQ_PASSWORD
          envFrom:
            - configMapRef:
                name: orchestrator-config
          resources:
            requests:
              cpu: 100m
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api-gateway-app
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api-gateway-app
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
